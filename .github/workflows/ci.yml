name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race -shuffle=on ./...

      - name: Build packages
        run: go build ./...

  # Repository and schema tests against a throwaway PostgreSQL. The browser
  # specs (tests/browser) need the goweb stack and stay opt-in.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calbooker
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: calbooker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U calbooker -d calbooker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run integration tests
        env:
          CALBOOKER_DATABASE_URL: postgres://calbooker:ci-only-password@localhost:5432/calbooker?sslmode=disable
        run: go test -race -tags=integration -count=1 ./...

  # Builds the image from the Dockerfile on every run, so a broken Dockerfile
  # fails the pull request. On pushes to master, after the other jobs pass, it
  # publishes ghcr.io/<owner>/<repo>:<commit sha> and :latest. Deployments
  # should pin the commit tag. See docs/deployment.md.
  image:
    needs: [verify, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
